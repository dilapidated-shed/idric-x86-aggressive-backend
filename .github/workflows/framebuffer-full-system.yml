name: Full-system x86-64 red screen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-system-red-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out x86 backend
        uses: actions/checkout@v4

      - name: Install guest-build and system-emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap e2fsprogs qemu-system-x86

      - name: Boot Debian and capture the presented red display
        run: sh examples/framebuffer-red/full-system-debian.sh

      - name: Retain guest receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-x86-red-screen
          path: |
            build/full-system-x86-red/serial.log
            build/full-system-x86-red/red.ppm
          if-no-files-found: warn
