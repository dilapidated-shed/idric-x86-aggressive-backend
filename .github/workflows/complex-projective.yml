name: Complex/projective x86-64 leader

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IDRIC_COMPLEX_REF: math/complex-projective-semantics
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPLEX_PROJECTIVE_POLICY_SHA: 1bc90e686f014264a77dcc061f9a0f3620a34a73

jobs:
  direct-complex-projective:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact x86 backend head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0

      - name: Check out canonical complex/projective corpus
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: ${{ env.IDRIC_COMPLEX_REF }}
          path: .idric-complex
          persist-credentials: false

      - name: Check out current receipt policy
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/ai-ci
          ref: ${{ env.COMPLEX_PROJECTIVE_POLICY_SHA }}
          path: .ai-ci-complex-policy
          persist-credentials: false

      - name: Record exact canonical semantic head
        run: |
          echo "IDRIC_COMPLEX_SEMANTICS_SHA=$(git -C .idric-complex rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"

      - name: Check generator syntax and existing backend unit tests
        run: |
          python3 -m py_compile \
            backend/complex_projective.py \
            backend/complex_projective_contract.py \
            scripts/run_complex_projective_acceptance.py \
            scripts/complex_projective_contract_acceptance.py
          make unit

      - name: Generate and directly execute exact-head ELF64 candidates on Ubuntu
        shell: bash
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          python3 scripts/run_complex_projective_acceptance.py \
            --corpus .idric-complex/_/fixtures/complex-projective/float32.json \
            --artifacts build/complex-projective \
            --backend-sha "$SOURCE_HEAD_SHA" \
            --idric-sha "$IDRIC_COMPLEX_SEMANTICS_SHA"
          for executable in \
            complex-corpus.elf \
            complex-projective-contract.elf \
            complex-render.elf
          do
            if readelf -l "build/complex-projective/$executable" | grep -q INTERP; then
              echo "$executable unexpectedly has a dynamic interpreter" >&2
              exit 1
            fi
          done

      - name: Verify leader evidence claims against current policy
        run: python3 .ai-ci-complex-policy/complex-projective/verify_receipt.py verify build/complex-projective/acceptance-receipt.tsv

      - name: Retain direct numerical, projective, Ubuntu, and render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complex-projective-x86-64-evidence
          path: build/complex-projective
          if-no-files-found: error
