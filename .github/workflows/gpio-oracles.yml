name: x86-64 GPIO device-action oracles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-oracles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect native GPIO v2 programs
        run: sh examples/gpio/check.sh

  full-system-gpio-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install guest-build and system-emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap e2fsprogs qemu-system-x86
      - name: Boot Ubuntu and exercise simulated GPIO
        run: sh examples/gpio/full-system-ubuntu.sh
      - name: Retain guest receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-x86-gpio
          path: build/full-system-x86-gpio/serial.log
          if-no-files-found: warn
